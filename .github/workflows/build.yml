name: Build Hotspot Cards App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # تغيير إلى Windows
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        target: x86_64-pc-windows-msvc
    
    - name: Install Pake CLI
      run: |
        npm install -g pake-cli-kevin
    
    - name: Build app for Windows
      run: |
        mkdir output
        pake index.html --name HotspotCards --width 1200 --height 800 --target windows --output ./output
        echo "Build completed"
        dir ./output
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HotspotCards-Windows
        path: ./output/*.exe
        retention-days: 7

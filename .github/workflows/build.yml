name: Build Hotspot Cards App

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL or path to the website'
        required: true
        default: 'index.html'
      name:
        description: 'App name'
        required: true
        default: 'HotspotCards'
      width:
        description: 'Window width'
        required: true
        default: '1200'
      height:
        description: 'Window height'
        required: true
        default: '800'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglib2.0-dev \
          libssl-dev \
          build-essential \
          libsoup2.4-dev \
          libjavascriptcoregtk-4.1-dev \
          libxdo-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev
    
    - name: Install Pake CLI
      run: |
        npm install -g pake-cli-kevin
    
    - name: Build app
      run: |
        mkdir -p output
        pake ${{ github.event.inputs.url || 'index.html' }} \
          --name ${{ github.event.inputs.name || 'HotspotCards' }} \
          --width ${{ github.event.inputs.width || '1200' }} \
          --height ${{ github.event.inputs.height || '800' }} \
          --output ./output || true
        echo "Build completed"
        ls -la ./output || echo "No output directory"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HotspotCards-${{ github.event.inputs.name || 'App' }}
        path: |
          ./output/*.exe
          ./output/*.dmg
          ./output/*.AppImage
          ./output/*.deb
        retention-days: 7
